<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Miner Wars pages retired</title>
  <style>
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0e0f1f;
      color: #fff;
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
    }
    main {
      width: min(620px, calc(100% - 40px));
      padding: 36px;
      border: 1px solid #2a2a38;
      border-radius: 18px;
      background: #161828;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .3);
    }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { margin: 0; color: #b7b8ca; }
  </style>
</head>
<body>
  <main>
    <h1>Miner Wars pages retired</h1>
    <p>The calculator, cycle pages, and live-data services are no longer maintained.</p>
  </main>
</body>
</html>
